components:
  responses:
    error_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_response'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error_response'
    error_403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_response'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error_response'
    error_500:
      description: Internal Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_response'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error_response'
    error_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_response'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error_response'
    error_429:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error_response'
        application/xml:
          schema:
            $ref: '#/components/schemas/Error_response'
  schemas:
    ai-responses:
      properties:
        ai_responses:
          items:
            properties:
              country:
                type: string
                title: country
                description: The country of the question.
              data_source:
                type: string
                title: data_source
                description: The chatbot model that generated the response.
              last_updated:
                type: string
                format: date
                title: last_updated
                description: The date when the data was last updated.
              links:
                items:
                  properties:
                    url:
                      type: string
                    title:
                      type:
                      - string
                      - 'null'
                  type: object
                type: array
                title: links
                description: (10 units) The links used for the response.
              question:
                type: string
                title: question
                description: The question asked by the user.
              response:
                type: string
                title: response
                description: (10 units) The response from the model.
              search_queries:
                items:
                  type: string
                type: array
                title: search_queries
                description: 'The search query used by the chatbot to find information for the response. Note: if `data_source` does not include `chatgpt` or `perplexity`, this field will always be empty.'
              tags:
                items:
                  type: string
                type: array
                title: tags
                description: Tags assigned to the query.
              volume:
                type: integer
                title: volume
                description: (10 units) Estimated monthly searches. This is based on our estimates for Google, combining the search volumes of related keywords where this question appears in People Also Ask section.
            type: object
          type: array
      type: object
      xml:
        name: AhrefsApiResponse
    cited-pages:
      properties:
        pages:
          items:
            properties:
              mentions:
                items:
                  properties: {}
                  type: object
                type: array
                title: mentions
                description: Deprecated on 2026-02-10.
              responses:
                type: integer
                title: responses
                description: The number of responses that cited the page.
              url:
                type: string
                title: url
                description: The URL of the cited page.
              volume:
                type: integer
                title: volume
                description: Deprecated on 2026-03-24.
            type: object
          type: array
      type: object
      xml:
        name: AhrefsApiResponse
    entity:
      anyOf:
      - required:
        - names
      - required:
        - url_groups
      properties:
        names:
          items:
            type: string
          type: array
          description: The names of the brand/competitor
          examples:
          - - ahrefs
            - ahrefs seo
        url_groups:
          items:
            properties:
              target:
                type: string
                format: domain
                description: The domain of the target
                examples:
                - ahrefs.com
              scope:
                type: string
                enum:
                - url
                - path
                - domain
                - subdomains
                description: Scope of the target.
            type: object
            required:
            - target
            - scope
          type: array
      type: object
    Error_response:
      properties:
        error:
          type: string
      type: object
      xml:
        name: AhrefsApiResponse
    cited-domains:
      properties:
        domains:
          items:
            properties:
              domain:
                type: string
                title: domain
                description: The cited domain name.
              mentions:
                items:
                  properties: {}
                  type: object
                type: array
                title: mentions
                description: Deprecated on 2026-02-10.
              pages:
                type: integer
                title: pages
                description: The number of unique pages from the domain that were cited in the responses.
              responses:
                type: integer
                title: responses
                description: The number of responses that cited the domain.
              volume:
                type: integer
                title: volume
                description: Deprecated on 2026-03-24.
            type: object
          type: array
      type: object
      xml:
        name: AhrefsApiResponse
  parameters:
    output_json_php:
      description: The output format.
      required: false
      explode: false
      schema:
        type: string
        enum:
        - json
        - php
      name: output
      in: query
  securitySchemes:
    http:
      type: http
      scheme: bearer
externalDocs:
  description: ''
  url: https://docs.ahrefs.com/docs/api/v3/
