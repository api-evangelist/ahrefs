openapi: 3.2.0
info:
  title: Brand Radar AI visibility API
  description: Brand radar.
  termsOfService: https://ahrefs.com/terms
  contact:
    name: Ahrefs
    url: https://ahrefs.com/
    email: support@ahrefs.com
  version: 3.0.0
servers:
- url: https://api.ahrefs.com/v3/brand-radar
  description: Ahrefs Brand Radar
security:
- http:
  - read
tags:
- name: AI visibility
paths:
  /ai-responses:
    get:
