note: >-
  Ahrefs' REST and MCP surfaces are not equal projections. The verifiable MCP tool list covers the
  read-heavy research core (Site Explorer, Keywords Explorer, SERP Overview, Batch Analysis) and a
  read-only slice of Management/Site Audit, while 109 REST operations — every Web Analytics, Brand
  Radar, GSC Insights and Social Media report, all Management writes, and the Public endpoints — have
  no tool in that list. The hosted remote server advertises groups for several of those families
  (web-analytics-*, brand-radar-*, gsc, social-media, public, subscription-info), so the remote tool
  set is materially larger than the local one; the exact names and inputSchemas require authenticated
  introspection.
