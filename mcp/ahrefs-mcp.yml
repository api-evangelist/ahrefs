    - well-known/ahrefs-oauth-authorization-server.json
    - well-known/ahrefs-oauth-protected-resource.json
  - type: apiKey
    note: >-
      An MCP-scoped API key generated in Account settings / API keys. Enterprise customers may also
      connect with regular API keys.
  consent: >-
    Connecting an AI client shows an Ahrefs authorization consent screen; on approval the connection
    appears in the account with a dedicated API key tagged with `MCP` scope. Workspace admins can set
    a monthly API-unit limit per key.
