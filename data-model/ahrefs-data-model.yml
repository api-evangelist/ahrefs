source: openapi/_original/ahrefs-openapi-original.json
note: >-
  Ahrefs' API is a reporting surface, not a CRUD resource graph. 144 component schemas exist but 118 of
  the 148 operations are report readers whose "schema" is a row shape for one report, not a persistent
  entity — there is no `GET /backlinks/{id}`, no self link, and no id on a backlink row. Only the
  Management, Site Audit and Social Media families expose durable, id-addressed objects. The graph
  below therefore separates PROJECT-SCOPED ENTITIES (real objects with ids and lifecycles) from
  ANALYTICAL SUBJECTS (targets, keywords, brands — addressed by value, never by id) and REPORT ROW
  SHAPES (per-report projections).
entities:
- name: project
  id_field: project_id
  id_referenced_by_operations: 63
  domain: Management / Rank Tracker / Site Audit / Web Analytics / GSC Insights / Bot Analytics
  lifecycle: create, read, update, delete
  operations:
  - management.projects
  - management.post-projects
  - management.delete-projects
  fields_seen:
  - project_id
  - verified
  - folder
  note: >-
    The single most-referenced identifier in the API and the spine of everything account-scoped. A
    project can be placed in a folder (`folder_id` on create, `folder` returned on read) and carries a
    `verified` flag.
