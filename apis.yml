apis:
- aid: ahrefs:mcp
  name: Ahrefs MCP Server
  description: >-
    Ahrefs' hosted, remote Model Context Protocol server, which lets AI agents query the Ahrefs API on
    behalf of a signed-in Ahrefs account. Streamable HTTP transport, OAuth 2.0 with PKCE (scope apiv3-mcp),
    tool groups selectable via a tools query parameter. Available on Lite plans and above; requests consume
    the account's API units.
  humanURL: https://docs.ahrefs.com/mcp/docs/introduction
  baseURL: https://api.ahrefs.com/mcp/mcp
  tags:
  - MCP
  - Agents
