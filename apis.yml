aid: ahrefs
name: Ahrefs
description: Ahrefs is a Singapore-based SEO and marketing intelligence platform built on its own web
  crawler and index, offering Site Explorer, Keywords Explorer, Site Audit, Rank Tracker, SERP Overview,
  Brand Radar, Web Analytics and Social Media Management. The Ahrefs API v3 exposes that data set as a
  REST API at https://api.ahrefs.com/v3 with 148 operations across 13 tools, documented by a single
  OpenAPI 3.2.0 specification plus one machine-readable spec per tool. Access is metered in API units
  with a 50-unit request floor, authenticated with a bearer API key, and additionally reachable through
  a hosted MCP server and the OAuth-based Ahrefs Connect partner program.
