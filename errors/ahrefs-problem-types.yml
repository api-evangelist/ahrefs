problems:
- status: 400
  title: Bad Request
  schema: '<tool>.Error response'
  causes:
  - malformed or missing required query parameter
  - a field name in `select`, `where` or `order_by` that the endpoint does not accept
  - an invalid `where` filter expression
  - a date not in YYYY-MM-DD form
  remediation: >-
    Check the operation's parameter list in the spec; the field names valid in `where` may differ from
    those valid in `select`. All parameter values must be percent-encoded.
- status: 401
  title: Unauthorized
  schema: '<tool>.Error response'
  causes:
  - missing Authorization header
  - expired API key (keys have a one-year lifetime)
  - key invalidated because its creator was removed from the workspace
  - an MCP key used against the local server, or an API v3 key used where an MCP key is required
  remediation: Re-issue the key at https://app.ahrefs.com/account/api-keys.
- status: 403
  title: Forbidden
  schema: '<tool>.Error response'
  causes:
  - endpoint or tool not included in the subscription plan
  - API-unit allowance exhausted with pay-as-you-go disabled or capped
  - per-key monthly unit limit reached
  remediation: >-
    Call subscription-info.limits-and-usage to read remaining allowance; check per-key caps in Account
    settings / API keys.
- status: 429
  title: Too Many Requests
  schema: '<tool>.Error response'
  causes:
  - more than 60 requests in a minute
  - dynamic throttling based on real-time system load and request cost
  remediation: >-
    Back off and retry. No Retry-After or RateLimit-* header is returned, so the delay must be chosen
    by the client. The official Python SDK retries 429 and 5xx automatically.
  detail: rate-limits/ahrefs-rate-limits.yml
- status: 500
  title: Internal Error
  schema: '<tool>.Error response'
  causes:
  - server-side failure
  remediation: Retry with backoff; contact support@ahrefs.com if persistent.
