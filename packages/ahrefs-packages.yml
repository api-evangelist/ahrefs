method: searched
source: >-
  registry.npmjs.org, pypi.org, repo.packagist.org, api.github.com/orgs/ahrefs and
  https://docs.ahrefs.com/llms.txt
note: >-
  Ahrefs ships first-party client code, but almost none of it reaches a package registry. The official
  Python SDK is distributed only from GitHub (`pip install git+https://github.com/ahrefs/ahrefs-python.git`)
  and is still tagged `-alpha`; there is no `ahrefs` project on PyPI. The npm package `ahrefs` is a
  third-party 2015 client, not Ahrefs'. The only first-party registry artifacts are `@ahrefs/mcp` on
  npm — which Ahrefs' own README now marks unmaintained and outdated — and a PHP wrapper on Packagist
  that still targets the retired API v2.
packages:
- language: python
  registry: github
  name: ahrefs-python
  url: https://github.com/ahrefs/ahrefs-python
  install: pip install git+https://github.com/ahrefs/ahrefs-python.git
  official: true
  version: v0.9.0-alpha
  published: '2026-03-22'
  version_source: https://api.github.com/repos/ahrefs/ahrefs-python/releases
  note: >-
    The official Python SDK, auto-generated from the OpenAPI spec — 105 methods across 11 API
    sections, sync `AhrefsClient` and async `AsyncAhrefsClient`, typed pydantic request/response
    models, built-in retry on 429/5xx, requires Python 3.11+ (httpx + pydantic). Not published to
    PyPI: the only distribution channel is a git install, so there is no registry metadata endpoint
    and no immutable version a consumer can pin by name. Still on alpha tags after nine releases.
- language: javascript
  registry: npm
  name: '@ahrefs/mcp'
  url: https://www.npmjs.com/package/@ahrefs/mcp
  install: npm install -g @ahrefs/mcp
  official: true
  version: 0.0.11
  published: '2025-05-27'
  version_source: https://registry.npmjs.org/@ahrefs/mcp
  repo: https://github.com/ahrefs/ahrefs-mcp-server
  note: >-
    The local (stdio) Ahrefs MCP server, exposing 41 tools over API v3 keys. Ahrefs' own repository
    README states it is no longer maintained and directs users to the hosted remote server at
    https://api.ahrefs.com/mcp/mcp. Last publish 2025-05-27 — 14 months before this check, and before
    the Brand Radar, GSC Insights, Social Media and Web Analytics tools were added to API v3.
